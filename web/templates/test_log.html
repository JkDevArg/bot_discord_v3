<!DOCTYPE html>
<html>
<head>
    <title>Test Discord Logging</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        button {
            background: #5865F2;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #4752C4;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #43B581;
        }
        .error {
            background: #F04747;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Discord Logging</h1>
    <p>Haz clic en el botón para enviar un mensaje de prueba al canal #log_bot</p>
    
    <button onclick="testLog()">Enviar Mensaje de Prueba</button>
    
    <div id="result"></div>

    <script>
        async function testLog() {
            const token = localStorage.getItem('token');
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.textContent = '⏳ Enviando mensaje...';
            
            try {
                const response = await fetch('/api/test/discord-log', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = '✅ ' + data.message;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = '❌ Error: ' + (data.error || 'Unknown error');
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = '❌ Error de conexión: ' + error.message;
            }
        }
    </script>
</body>
</html>
