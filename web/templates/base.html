<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HackL4bs Admin{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Mobile Top Navbar -->
    <nav class="navbar navbar-dark bg-transparent fixed-top d-md-none p-3 backdrop-blur">
        <div class="container-fluid">
            <button class="btn btn-dark-glow" type="button" onclick="toggleSidebar()">
                <i class="bi bi-list fs-4"></i>
            </button>
            <span class="navbar-brand mb-0 h1 fw-bold text-white">HACKL4BS</span>
            <div style="width: 40px;"></div> <!-- Spacer -->
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block sidebar collapse" id="sidebarMenu">
                <div class="sidebar-header text-center animate__animated animate__fadeInLeft">
                    <!-- Placeholder Icon/Logo -->
                    <div class="mb-2">
                        <i class="bi bi-box-seam text-info"
                            style="font-size: 2.5rem; text-shadow: 0 0 15px rgba(76,201,240,0.8);"></i>
                    </div>
                    <div class="brand-title">HACKL4BS</div>
                    <span class="brand-subtitle">CYBERSECURITY</span>
                </div>

                <ul class="nav flex-column mt-3 animate__animated animate__fadeInLeft animate__delay-1s">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}"
                            href="/dashboard">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/users' %}active{% endif %}" href="/users">
                            <i class="bi bi-people"></i> Usuarios
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/roles' %}active{% endif %}" href="/roles">
                            <i class="bi bi-award"></i> Roles
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/shop' %}active{% endif %}" href="/shop">
                            <i class="bi bi-shop"></i> Tienda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/events' %}active{% endif %}" href="/events">
                            <i class="bi bi-calendar-event"></i> Eventos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/moderation' %}active{% endif %}"
                            href="/moderation">
                            <i class="bi bi-shield-exclamation"></i> Moderación
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/bot-settings' %}active{% endif %}"
                            href="/bot-settings">
                            <i class="bi bi-sliders"></i> Config. Bot
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/settings' %}active{% endif %}" href="/settings">
                            <i class="bi bi-gear"></i> Configuración
                        </a>
                    </li>

                    <hr class="border-secondary opacity-25 my-3">

                    <li class="nav-item">
                        <a class="nav-link text-danger" href="#" onclick="logout(); return false;">
                            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="py-4"> <!-- Removed animation class to fix Modal Z-Index issues -->
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sidebar Toggle Logic for Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarMenu');
            const overlay = document.getElementById('sidebarOverlay');

            // Bootstrap sets 'collapse' class for desktops, we toggle 'show' manually for mobile logic
            if (sidebar.classList.contains('show')) {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            } else {
                sidebar.classList.add('show');
                overlay.classList.add('show');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
