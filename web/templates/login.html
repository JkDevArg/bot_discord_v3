<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Discord Bot Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #5865F2;
            --secondary-color: #57F287;
            --dark-bg: #2C2F33;
            --darker-bg: #23272A;
        }

        body {
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: var(--dark-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header i {
            font-size: 64px;
            color: var(--primary-color);
        }

        .login-header h2 {
            color: white;
            margin-top: 15px;
            font-weight: 600;
        }

        .form-control {
            background-color: var(--darker-bg);
            border: 2px solid transparent;
            color: white;
            padding: 12px;
            border-radius: 8px;
        }

        .form-control:focus {
            background-color: var(--darker-bg);
            border-color: var(--primary-color);
            color: white;
            box-shadow: none;
        }

        .btn-login {
            background-color: var(--primary-color);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
        }

        .alert {
            border-radius: 8px;
        }

        .mfa-section {
            display: none;
        }

        .qr-code {
            text-align: center;
            margin: 20px 0;
        }

        .qr-code img {
            max-width: 200px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-discord"></i>
            <h2>Admin Panel</h2>
            <p class="text-muted">Inicia sesión para continuar</p>
        </div>

        <div id="alert-container"></div>

        <!-- Fase 1: Login -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label text-white">Usuario</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-white">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-login btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </button>
        </form>

        <!-- Fase 2: MFA -->
        <div id="mfaSection" class="mfa-section">
            <h5 class="text-white mb-3">Autenticación de Dos Factores</h5>
            <p class="text-muted">Ingresa el código de tu aplicación de autenticación</p>
            <form id="mfaForm">
                <div class="mb-3">
                    <input type="text" class="form-control text-center" id="mfaToken" placeholder="000000" maxlength="6"
                        pattern="[0-9]{6}" required>
                </div>
                <button type="submit" class="btn btn-login btn-primary w-100">
                    Verificar
                </button>
                <button type="button" class="btn btn-secondary w-100 mt-2" onclick="showLoginForm()">
                    Volver
                </button>
            </form>
        </div>
    </div>

    <script>
        let currentUsername = '';

        // Login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            currentUsername = username;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert('danger', data.detail || 'Error al iniciar sesión');
                    return;
                }

                if (data.mfa_required) {
                    // Mostrar formulario MFA
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('mfaSection').style.display = 'block';
                    document.getElementById('mfaToken').focus();
                } else {
                    // Login exitoso, guardar token y redirigir
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                showAlert('danger', 'Error de conexión');
            }
        });

        // MFA form
        document.getElementById('mfaForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('mfaToken').value;

            try {
                const response = await fetch('/api/auth/verify-mfa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUsername,
                        token: token,
                        use_recovery: false
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert('danger', data.detail || 'Código MFA inválido');
                    return;
                }

                // Login exitoso
                localStorage.setItem('token', data.access_token);
                window.location.href = '/dashboard';
            } catch (error) {
                showAlert('danger', 'Error de conexión');
            }
        });

        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('mfaSection').style.display = 'none';
            document.getElementById('mfaToken').value = '';
        }

        function showAlert(type, message) {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            document.getElementById('alert-container').innerHTML = alertHtml;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
