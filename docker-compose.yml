services:
  bot:
    build: .
    container_name: discord_bot
    command: python -m bot.main
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network

  web:
    build: .
    container_name: discord_web
    command: python -m web.main
    env_file:
      - .env
    ports:
      - "8010:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: always
    depends_on:
      bot:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - bot_network

  db:
    image: postgres:15-alpine
    container_name: discord_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botdiscord
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  bot_network:
    driver: bridge
