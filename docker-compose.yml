services:
  bot:
    build: .
    container_name: discord_bot
    command: python -m bot.main
    env_file: .env
    volumes:
      - ./bot:/app/bot
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network

  web:
    build: .
    container_name: discord_web
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8010:8000"
    volumes:
      - ./web:/app/web
      - ./bot:/app/bot
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - bot_network

  db:
    image: postgres:15-alpine
    container_name: discord_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-botdiscord}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  bot_network:
    driver: bridge
