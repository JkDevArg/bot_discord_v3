services:
  bot:
    build: .
    container_name: discord_bot
    command: python -m bot.main
    volumes:
      - ./bot:/app/bot
      - ./data:/app/data
      - ./logs:/app/logs
    restart: always
    environment:
      DISCORD_TOKEN: "${DISCORD_TOKEN:-MTQ1NjkxMDg3NDI3ODM2MzIxNg.GZUgqZ.TDSnl6Kk0F4aDl2X_N8L78Tzo7twqbRiZnZTfI}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-1456358603790483509}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@db:5432/botdiscord}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network

  web:
    build: .
    container_name: discord_web
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8010:8000"
    volumes:
      - ./web:/app/web
      - ./bot:/app/bot
      - ./data:/app/data
      - ./logs:/app/logs
    restart: always
    environment:
      DISCORD_TOKEN: "${DISCORD_TOKEN:-MTQ1NjkxMDg3NDI3ODM2MzIxNg.GZUgqZ.TDSnl6Kk0F4aDl2X_N8L78Tzo7twqbRiZnZTfI}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-1456358603790483509}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@db:5432/botdiscord}"
      WEB_SECRET_KEY: "${WEB_SECRET_KEY:-th3h4ck3rsl4bs}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
    depends_on:
      bot:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - bot_network

  db:
    image: postgres:15-alpine
    container_name: discord_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botdiscord
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  bot_network:
    driver: bridge
