services:
  bot:
    build: .
    container_name: discord_bot
    command: python -m bot.main
    env_file: .env
    volumes:
      - ./bot:/app/bot
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network

  web:
    build: .
    container_name: discord_web
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8010:8000"
    volumes:
      - ./web:/app/web
      - ./bot:/app/bot
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - bot_network

  db:
    image: mysql:8.0
    container_name: discord_db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-botdiscord}
      MYSQL_USER: ${MYSQL_USER:-botuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-botpassword}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=200
      --innodb_buffer_pool_size=256M
      --innodb_log_file_size=64M
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3433:3306"
    networks:
      - bot_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  bot_network:
    driver: bridge
